[project]
name = "learnhub-mcp-server"
version = "0.1.0"
description = "Multi-tenant MCP server that gives AI assistants safe, rate-limited access to an LMS REST API (local stdio + AWS Lambda)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mohamed Amine Ben Afia" }]
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
mock = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
learnhub-mcp = "learnhub_mcp.server:main"
learnhub-mock-api = "mock_api.app:main"
learnhub-hash-token = "learnhub_mcp.tenants:hash_token_cli"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnhub_mcp", "src/mock_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
