[project]
name = "learnhub-mcp-server"
version = "0.3.0"
description = "Multi-tenant MCP server that gives AI assistants safe, rate-limited access to learning data from any LMS API or database, configured without code (stdio, Streamable HTTP and AWS Lambda)."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohamed Amine Ben Afia" }]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx>=0.27",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "starlette>=0.40,<2",
    "uvicorn>=0.29,<1",
]

[project.urls]
Repository = "https://github.com/MedAmine-SUDO/learnhub-mcp-server"
Documentation = "https://github.com/MedAmine-SUDO/learnhub-mcp-server#readme"
Issues = "https://github.com/MedAmine-SUDO/learnhub-mcp-server/issues"
Changelog = "https://github.com/MedAmine-SUDO/learnhub-mcp-server/blob/main/CHANGELOG.md"

[project.optional-dependencies]
s3 = ["boto3>=1.34"]
sql = ["sqlalchemy>=2.0"]
aws = ["boto3>=1.34", "mangum>=0.19,<1"]
mock = ["fastapi>=0.110", "uvicorn>=0.29"]

[project.scripts]
learnhub-mcp = "learnhub_mcp.server:main"
learnhub-mcp-http = "learnhub_mcp.http_server:main"
learnhub-mock-api = "mock_api.app:main"
learnhub-hash-token = "learnhub_mcp.tenants:hash_token_cli"

[dependency-groups]
dev = ["pytest>=8", "fastapi>=0.110", "uvicorn>=0.29", "boto3>=1.34", "mangum>=0.19,<1", "sqlalchemy>=2.0"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/learnhub_mcp", "src/mock_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
