<text class="l0" x="20" y="62" fill="#e6edf3" xml:space="preserve">$ uv run python examples/demo_session.py</text><text class="l1" x="20" y="84" fill="#58c4dc" xml:space="preserve">→ initialize</text><text class="l2" x="20" y="106" fill="#9fe2a0" xml:space="preserve">  ← learnhub-mcp 0.1.0  (tenant: Acme Corp)</text><text class="l3" x="20" y="128" fill="#58c4dc" xml:space="preserve">→ tools/list</text><text class="l4" x="20" y="150" fill="#9fe2a0" xml:space="preserve">  ← 7 tools: list_users, get_user, list_trainings, get_training, ...</text><text class="l5" x="20" y="172" fill="#58c4dc" xml:space="preserve">→ list_users {&quot;role&quot;: &quot;instructor&quot;, &quot;max_results&quot;: 3}</text><text class="l6" x="20" y="194" fill="#9fe2a0" xml:space="preserve">  ← 3 inline: Jade Dubois, Karim Saidi, Rami Khelifi</text><text class="l7" x="20" y="216" fill="#58c4dc" xml:space="preserve">→ list_users {&quot;max_results&quot;: 300}</text><text class="l8" x="20" y="238" fill="#9fe2a0" xml:space="preserve">  ← too big for the context window -&gt; stored as list_users-be971c558d9a (5-row preview)</text><text class="l9" x="20" y="260" fill="#58c4dc" xml:space="preserve">→ read_stored_result {&quot;offset&quot;: 295, &quot;limit&quot;: 10}</text><text class="l10" x="20" y="282" fill="#9fe2a0" xml:space="preserve">  ← 5 rows, has_more=False</text><text class="l11" x="20" y="304" fill="#58c4dc" xml:space="preserve">→ get_training {&quot;training_id&quot;: 15002}</text><text class="l12" x="20" y="326" fill="#9fe2a0" xml:space="preserve">  ← &quot;Security Advanced Workshop&quot;: 107 enrolled, 29% completed</text><text class="l13" x="20" y="348" fill="#58c4dc" xml:space="preserve">→ get_user {&quot;user_id&quot;: 20001}  # a Globex user</text><text class="l14" x="20" y="370" fill="#f0b72f" xml:space="preserve">  ← isError=True NotFoundError: tenant isolation holds</text>
