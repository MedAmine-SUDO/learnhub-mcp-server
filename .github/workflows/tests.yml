name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run pytest -q

  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          python - <<'PYCODE'
          import os, tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          if os.environ["GITHUB_REF_NAME"] != f"v{version}":
              raise SystemExit("Release tag must match the package version")
          PYCODE
      - run: bash scripts/check_distribution.sh
      - run: uvx --from twine twine check --strict build/release-dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: learnhub-release-distributions
          path: build/release-dist/*
          if-no-files-found: error
      - run: bash deploy/build_lambda.sh
      - uses: actions/upload-artifact@v4
        with:
          name: learnhub-lambda-python312-x86_64
          path: build/lambda.zip
          if-no-files-found: error
